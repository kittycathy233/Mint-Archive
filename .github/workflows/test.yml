name: 撅了

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
    PROJECT_NAME: "kittycathy233/Mint-Archive"

jobs:
  build-desktop:
    name: Build Desktop Platforms
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: windows
            haxe-def: windows
            artifact-name: windows-build
            build-dir: export/release/windows
            
          - target: linux
            haxe-def: linux
            artifact-name: linux-build
            build-dir: export/release/linux
            
          - target: mac
            haxe-def: mac
            artifact-name: mac-build
            build-dir: export/release/mac

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Haxe
      uses: actions/setup-haxe@v1
      with:
        haxe-version: '4.3.6'

    - name: Install Haxe dependencies
      run: |
        haxelib install openfl 9.4.1
        haxelib install flixel 6.1.0
        haxelib install flixel-addons 3.3.2
        haxelib install flixel-ui 2.6.4
        haxelib install starling 2.7.1
        haxelib install hxcpp 4.3.2
        haxelib install hxvlc 2.2.2
        haxelib install lime 8.1.3
        haxelib install hscript 2.6.0
        haxelib install json2object 3.11.0
        haxelib install hxjsonast 1.1.0
        haxelib git spine-haxe https://github.com/EsotericSoftware/spine-runtimes/ cd726af62b8cbf12ba47c6c0f68d8e04451cf162 --dir spine-haxe
        haxelib git funkin.vis https://github.com/FunkinCrew/funkVis
        haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio

    - name: Build project for ${{ matrix.target }}
      run: |
        lime build ${{ matrix.target }} -v -D${{ matrix.haxe-def }}

    - name: Upload ${{ matrix.target }} build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.build-dir }}/**

  build-mobile:
    name: Build Mobile Platforms
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: ios
            haxe-def: ios
            artifact-name: ios-build
            build-dir: export/release/ios
            
          - target: android
            haxe-def: android
            artifact-name: android-build
            build-dir: export/release/android

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Haxe
      uses: actions/setup-haxe@v1
      with:
        haxe-version: '4.3.6'

    - name: Install Haxe dependencies
      run: |
        haxelib install openfl 9.4.1
        haxelib install flixel 6.1.0
        haxelib install flixel-addons 3.3.2
        haxelib install flixel-ui 2.6.4
        haxelib install starling 2.7.1
        haxelib install hxcpp 4.3.2
        haxelib install hxvlc 2.2.2
        haxelib install lime 8.1.3
        haxelib install hscript 2.6.0
        haxelib install json2object 3.11.0
        haxelib install hxjsonast 1.1.0
        haxelib git spine-haxe https://github.com/EsotericSoftware/spine-runtimes/ cd726af62b8cbf12ba47c6c0f68d8e04451cf162 --dir spine-haxe
        haxelib git funkin.vis https://github.com/FunkinCrew/funkVis
        haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio

    - name: Setup Android SDK (for Android builds)
      if: matrix.target == 'android'
      uses: android-actions/setup-android@v3

    - name: Build project for ${{ matrix.target }}
      run: |
        lime build ${{ matrix.target }} -v -D${{ matrix.haxe-def }}

    - name: Upload ${{ matrix.target }} build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.build-dir }}/**
